<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My first Vue page</title>
    <style>
      #app {
        border: dashed black 1px;
        width: 80%;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
      }
      img {
        width: 70px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Example: 'v-for' to create li-tags</h1>
    <div id="app">
      <ol>
        <li v-for="x in manyFoods">{{ x }}</li>
      </ol>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            manyFoods: ["Salad", "Cake", "Soup", "Fish", "Pizza", "Rice"],
          };
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
